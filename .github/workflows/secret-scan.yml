name: Secret Scan
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --fail --no-verification